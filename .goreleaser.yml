version: 2

project_name: zlib

before:
  hooks:
    # Fail instead of rewriting go.mod/go.sum: a tidy that changes files
    # would build from a tree that differs from the tag.
    - go mod tidy -diff
    - go test ./...

builds:
  - id: zlib
    main: ./cmd/zlib
    binary: zlib
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Rebuilding a tag must give the same binary: no checkout paths in the
    # binary, a file time and a build date taken from the commit, not the clock.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      # {{.Version}} drops the tag's v; zlib reports versions as vX.Y.Z.
      - -s -w -X github.com/heartleo/zlib/internal/zlib.Version=v{{.Version}} -X github.com/heartleo/zlib/internal/zlib.Commit={{.Commit}} -X github.com/heartleo/zlib/internal/zlib.Date={{.CommitDate}}
    hooks:
      post:
        # One MCP Bundle per platform, uploaded with the release. The MCP
        # Registry entry (docs/mcp-registry.md) points at these files.
        - cmd: go run ./scripts/mcpb bundle --binary "{{ .Path }}" --os {{ .Os }} --arch {{ .Arch }} --version {{ .Version }} --out dist/mcpb

archives:
  - id: zlib
    ids:
      - zlib
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: dist/mcpb/*.mcpb

homebrew_casks:
  # Named zlib-cli because homebrew/core already ships a zlib formula; the
  # installed binary stays zlib.
  - name: zlib-cli
    ids:
      - zlib
    binaries:
      - zlib
    homepage: "https://github.com/heartleo/zlib"
    description: "A CLI for Z-Library"
    # Prereleases never reach the tap.
    skip_upload: auto
    hooks:
      post:
        # The binaries are not notarized; without this macOS quarantines them.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/zlib"], must_succeed: false
          end
    repository:
      owner: heartleo
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

winget:
  - name: zlib
    package_identifier: heartleo.zlib
    publisher: heartleo
    publisher_url: "https://github.com/heartleo"
    homepage: "https://github.com/heartleo/zlib"
    short_description: "A CLI for Z-Library"
    license: MIT
    tags:
      - z-library
      - ebook
      - terminal
      - cli
    skip_upload: auto
    repository:
      owner: heartleo
      name: winget-pkgs
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

changelog:
  # The GitHub API resolves each commit's author, which `git` cannot, and keeps
  # the groups and filters below (`github-native` ignores them).
  use: github
  sort: asc
  # Sections for readers, a line per change with the author's login.
  format: "{{ .Message }} (@{{ .AuthorUsername }})"
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Build
      regexp: '^build(\(.+\))?!?:'
      order: 3
    # Anything the filters below keep and no group claims, such as a revert,
    # still reaches the notes.
    - title: Others
      order: 999
  filters:
    exclude:
      # The plugin has its own version; its bumps say nothing about the CLI.
      - '^build\(plugin\)!?:'
      - '^docs(\(.+\))?!?:'
      - '^test(\(.+\))?!?:'
      - '^chore(\(.+\))?!?:'
      - '^ci(\(.+\))?!?:'
      - '^refactor(\(.+\))?!?:'
      - '^style(\(.+\))?!?:'
      - '^Merge '

release:
  draft: true
  replace_existing_draft: true
  # A tag such as v1.0.0-rc.1 is published as a prerelease.
  prerelease: auto
  extra_files:
    - glob: dist/mcpb/*.mcpb
  header: |
    ## zlib {{ .Tag }}
  footer: |
    ## Install

    See the [installation guide](https://github.com/heartleo/zlib/blob/main/docs/installation.md),
    or run `zlib update` from an existing install.

    ## Verify

    Check an archive against `checksums.txt`, or verify its signed build provenance:

    ```
    gh attestation verify <file> --repo heartleo/zlib
    ```

    **Full changelog**: https://github.com/heartleo/zlib/compare/{{ .PreviousTag }}...{{ .Tag }}

