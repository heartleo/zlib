name: govulncheck

# New vulnerabilities are published without any change to this repository,
# so scan main daily. Pushes and pull requests run the same scan in ci.yml.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-go installs exactly the go line of go.mod, which is also the
      # toolchain releases are built with.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # govulncheck checks the standard library of the go it runs.
      - name: Go version
        run: go version

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
