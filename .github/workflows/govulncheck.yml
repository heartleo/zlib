name: govulncheck

# New vulnerabilities are published without any change to this repository,
# so scan main daily. ci.yml runs the same scan on pushes and pull requests
# that can affect the Go build (scripts/ci-changes.mjs decides); this daily
# run also covers the changes that skipped it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-go installs exactly the go line of go.mod, which is also the
      # toolchain releases are built with.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # govulncheck checks the standard library of the go it runs.
      - name: Go version
        run: go version

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
